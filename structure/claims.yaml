# Current argument skeleton.  This file describes claims that the delivered paper and
# page actually make; abandoned or planned work is recorded as a limitation, never as a
# positive result.  Evidence points either to tracked project artifacts, the declared
# frozen upstream package, or a precise literature citation.

claims:
  - id: mismatch-snr-loss
    statement: >-
      In noise-free data a normalized template recovers the optimal SNR multiplied by
      its match with the signal, so fractional SNR loss is exactly mismatch.  Only the
      local approximation of mismatch by the quadratic metric is leading order.
    region: main and extended
    section: Scope and definitions
    job: q1bC
    status: established identity; metric approximation qualified separately
    evidence:
      - "Owen 1996 (gr-qc/9511032), Eqs. (1), (4)-(6), (10)-(13)"
      - "paper/main.tex::Scope and definitions"
      - "page/index.html::section 1, Scope and definitions"
    numbers: []

  - id: model-error-decomposition
    statement: >-
      TaylorF2-family loss and bank discretisation loss are reported separately.  The
      family-only quantity is an interpolation of 28 fitting-factor points, not a
      rigorous bound; the combined IMRPhenomD bank leg approximately composes it with
      discretisation match and is labelled as an approximation.
    region: main and extended, reported apart
    section: Results; Limitations
    job: q1bC plus local D1/F pipeline
    status: measured family-only leg; combined leg conditional on the composition model
    evidence:
      - "work/d1/optimum.py::prepare, run"
      - "data/part_f_optimum.json::losses"
      - "paper/main.tex::Waveform and discretisation losses"
      - "page/index.html::Waveform and discretisation losses"
    numbers:
      - imrphenomd_family_only_extended
      - imrphenomd_family_only_main
      - imrphenomd_volume_loss_extended
      - imrphenomd_volume_loss_main

  - id: metric-vs-owen
    statement: >-
      Bank placement uses the analytic non-spinning projected-phase TaylorF2 metric
      constructed by Owen's method in chirp-time coordinates.  A fixed-support numerical
      finite-difference calculation passes a pre-registered relative-error criterion at
      the headline mismatch, while coarser minimal-match settings lie outside the tested
      quadratic range.
    region: main and extended, reported apart
    section: Method; Limitations
    job: q1bC
    status: frozen upstream calculation; its support convention and validity limit are explicit
    evidence:
      - "jobs/2026-09-14_041516_derive-q1bc/out/lib/metric.py::analytic_metric"
      - "jobs/2026-09-14_041516_derive-q1bc/out/lib/numeric_metric.py"
      - "jobs/2026-09-14_041516_derive-q1bc/out/lib/metric_validation.py"
      - "Owen 1996 (gr-qc/9511032), Eqs. (11)-(16)"
      - "paper/main.tex::Metric"
    numbers:
      - metric_validation_relative_error_limit
      - minimal_match_headline

  - id: covering-at-mm097
    statement: >-
      Square and hexagonal banks use a generation-wise local-metric placement inspired
      by Cokelaer, but replace his explicit connector graph and add a project-specific
      boundary repair.  Uniform injections estimate population covering while adaptive
      witnesses refute strict covering for both hexagonal banks.  Count ratios are
      implementation- and boundary-dependent rather than universal lattice constants.
    region: main and extended, reported apart
    section: Method; Results
    job: local D1 pipeline
    status: measured for this implementation; not a faithful Cokelaer reproduction
    evidence:
      - "work/d1/placement.py::grow, reconnect_to_existing, repair_boundary"
      - "work/d1/report_d.py::measure"
      - "data/part_d_mm097.json"
      - "data/fig_witnesses.json"
      - "Cokelaer 2007 (arXiv:0706.4437), Sec. II and Tables I-II"
      - "paper/main.tex::Placement and relation to Cokelaer; Results"
    numbers:
      - adaptive_worst_mismatch_extended_hexagonal
      - adaptive_worst_mismatch_main_hexagonal
      - border_fraction_extended
      - border_fraction_main
      - cusp_secant_coefficient
      - effective_width_extended
      - effective_width_main
      - covering_fraction_extended_hexagonal_mm097
      - covering_fraction_extended_square_mm097
      - covering_fraction_main_hexagonal_mm097
      - covering_fraction_main_square_mm097
      - hex_square_ratio_extended_mm097
      - hex_square_ratio_main_mm097
      - n_templates_extended_hexagonal_mm097
      - n_templates_extended_square_mm097
      - n_templates_main_hexagonal_mm097
      - n_templates_main_square_mm097
      - proper_area_extended
      - proper_area_main
      - proper_perimeter_extended
      - proper_perimeter_main

  - id: detection-threshold
    statement: >-
      The exact independent-trials combination is kept distinct from its rare-tail
      Poisson approximation.  The naive template-time count is a conservative Gaussian
      upper bound; an equivalent trial rate fitted from simulated maxima is reported as
      an empirical, tail-dependent model and is extrapolated beyond its calibration
      range when used at the detection threshold.
    region: main and extended, reported apart
    section: Threshold and effective volume
    job: local D1 pipeline
    status: exact algebra plus conditional effective-trials calibration
    evidence:
      - "work/d1/threshold.py::solve_threshold, poisson_threshold"
      - "work/d1/nu_eff.py::mle_n_eff, threshold_estimates"
      - "data/part_e_mm097.json"
      - "data/part_e_nu_eff.json"
      - "Latała and Matlak 2017 (arXiv:1512.08776), Gaussian correlation inequality"
    numbers:
      - nu_eff_main_hexagonal_mm097
      - poisson_approximation_error
      - rho_star_naive_extended_hexagonal
      - rho_star_naive_extended_square
      - rho_star_naive_main_hexagonal
      - rho_star_naive_main_square
      - trials_exponent_extended_hexagonal
      - trials_exponent_extended_square
      - trials_exponent_main_hexagonal
      - trials_exponent_main_square
      - trials_exponent_pooled

  - id: volume-loss-rule
    statement: >-
      Exact nominal worst-case volume loss, its linear expansion, and the metric-predicted
      population-average loss are kept separate.  Effective volume is evaluated under
      both naive and fitted trials models; the trend reverses between them, while the
      fitted calibration does not reach the detection tail, so no robust optimal minimal
      match is claimed.
    region: main and extended, reported apart
    section: Results; Conclusion
    job: local D1 pipeline
    status: metric-predicted population loss; effective-volume conclusion conditional on trials model
    evidence:
      - "work/d1/optimum.py::run"
      - "data/part_f_optimum.json"
      - "scripts/make_figures.py::figure_volume_losses, figure_veff"
      - "Owen 1996 (gr-qc/9511032), event-rate scaling"
      - "Croce et al. 2004 (gr-qc/0404096)"
      - "Keppel 2013 (arXiv:1303.2005)"
    numbers:
      - population_volume_loss_extended_hexagonal_mm097
      - population_volume_loss_extended_square_mm097
      - population_volume_loss_main_hexagonal_mm097
      - population_volume_loss_main_square_mm097
      - veff_change_calibrated_extended_hexagonal
      - veff_change_calibrated_extended_square
      - veff_change_calibrated_main_hexagonal
      - veff_change_calibrated_main_square
      - veff_change_naive_extended_hexagonal
      - veff_change_naive_extended_square
      - veff_change_naive_main_hexagonal
      - veff_change_naive_main_square
      - worst_case_volume_loss_mm097

  - id: bank-spacing-cross-check-svd-not-done
