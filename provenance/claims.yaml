claims:
  - id: owen-matched-filter-loss
    statement: >
      For normalized templates in Owen's Gaussian-noise model, mismatch reduces the
      expected recovered SNR by the normalized template overlap.
    evidence:
      - "Owen, arXiv:gr-qc/9511032v1, Eqs. (1), (4)-(6), (10)"
      - "page/index.html::sections 3-4"
    numbers: []

  - id: owen-local-metric
    statement: >
      The Hessian of the match at coincident parameters defines a local metric with
      1-M = g_ij Delta-lambda^i Delta-lambda^j in Owen's convention.
    evidence:
      - "Owen, arXiv:gr-qc/9511032v1, Eqs. (11)-(13)"
      - "page/index.html::section 5"
    numbers: []

  - id: owen-volume-count
    statement: >
      Under Owen's hypercubic covering model, the template count is proper parameter-space
      volume divided by the cell volume set by the minimal match.
    evidence:
      - "Owen, arXiv:gr-qc/9511032v1, Eqs. (14)-(16), (43)"
      - "page/index.html::sections 6 and 9"
    numbers:
      - owen_mm_fiducial
      - recomputed_initial_template_count
      - recomputed_advanced_template_count
      - owen_reported_initial_template_count
      - owen_reported_advanced_template_count

  - id: owen-event-rate-scaling
    statement: >
      With a homogeneous Euclidean source distribution and fixed threshold, the worst-case
      retained event rate scales as MM cubed.
    evidence:
      - "Owen, arXiv:gr-qc/9511032v1, Eq. (23) and surrounding discussion"
      - "scripts/reproduce_owen1995.py::compute"
    numbers:
      - owen_mm_fiducial
      - owen_mm097_rate_fraction
      - owen_mm097_rate_loss
      - owen_event_loss_benchmark

  - id: owen-historical-psd
    statement: >
      The reproduction uses Owen's analytic initial- and advanced-LIGO benchmark PSDs,
      which are historical inputs rather than current detector curves.
    evidence:
      - "Owen, arXiv:gr-qc/9511032v1, Eq. (17) and Sec. II B"
      - "scripts/reproduce_owen1995.py::reproduce_case"
    numbers:
      - owen_initial_fs_hz
      - owen_initial_f0_hz
      - owen_advanced_fs_hz
      - owen_advanced_f0_hz

  - id: owen-metric-reproduced
    statement: >
      Direct quadrature of Owen's noise moments followed by time projection reproduces
      the printed two-dimensional metric components to their shown precision.
    evidence:
      - "scripts/reproduce_owen1995.py::normalized_moments"
      - "scripts/reproduce_owen1995.py::dimensionless_premetric"
      - "scripts/reproduce_owen1995.py::projected_metric"
      - "Owen, arXiv:gr-qc/9511032v1, Eqs. (18), (33), (34), (38), (40), (42)"
    numbers:
      - recomputed_initial_metric_11
      - recomputed_initial_metric_12
      - recomputed_initial_metric_22
      - recomputed_advanced_metric_11
      - recomputed_advanced_metric_12
      - recomputed_advanced_metric_22
      - recomputed_initial_sqrt_det
      - recomputed_advanced_sqrt_det

  - id: owen-eigensystem-reproduced
    statement: >
      Diagonalizing the full-precision recomputed metrics yields one stiff and one soft
      direction and the square-grid spacings reported in the note.
    evidence:
      - "scripts/reproduce_owen1995.py::symmetric_2x2_eigensystem"
      - "scripts/reproduce_owen1995.py::reproduce_case"
      - "Owen, arXiv:gr-qc/9511032v1, Eqs. (48)-(54)"
    numbers:
      - recomputed_initial_eigenvalue_stiff
      - recomputed_initial_eigenvalue_soft
      - recomputed_advanced_eigenvalue_stiff
      - recomputed_advanced_eigenvalue_soft
      - recomputed_initial_spacing_stiff_ms
      - recomputed_initial_spacing_soft_ms
      - recomputed_advanced_spacing_stiff_ms
      - recomputed_advanced_spacing_soft_ms

  - id: owen-domain-area-reproduced
    statement: >
      Integrating the analytic mass-to-chirp-time Jacobian over Owen's unbounded
      component-mass domain reproduces his Monte Carlo coordinate areas to the precision
      expected from the printed historical values.
    evidence:
      - "scripts/reproduce_owen1995.py::chirp_time_area"
      - "Owen, arXiv:gr-qc/9511032v1, Eqs. (35)-(36) and Sec. III B"
    numbers:
      - owen_minimum_mass_solar
      - recomputed_initial_area_s2
      - recomputed_advanced_area_s2
      - owen_reported_initial_area_s2
      - owen_reported_advanced_area_s2

  - id: owen-editorial-inconsistencies
    statement: >
      Owen Eqs. (44)-(45) must scale with (1-MM)^-1 rather than MM^-1, Eq. (49) contains
      a self-referential basis-vector label, and recomputation exposes small numerical
      inconsistencies among the printed matrices, eigenvalues, and spacings.
    evidence:
      - "scripts/reproduce_owen1995.py::compute"
      - "Owen, arXiv:gr-qc/9511032v1, Eqs. (16), (43)-(45), (49)-(54)"
      - "page/index.html::section 8.4"
    numbers: []

  - id: owen-historical-compute-cost
    statement: >
      Owen's online-search compute estimates are historical consequences of his PSD,
      waveform, filtering algorithm, and source-domain assumptions, not modern budgets.
    evidence:
      - "Owen, arXiv:gr-qc/9511032v1, Eqs. (55)-(61) and Sec. III D"
      - "page/index.html::section 9.4"
    numbers:
      - owen_reported_initial_gflops
      - owen_reported_advanced_gflops
      - owen_event_loss_benchmark

  - id: q1bc-hook-loop-token-reconciliation
    statement: >
      The first two q1bC Astra PI sessions consumed substantial quota while a broken
      relative Stop-hook path repeatedly returned errors; only planning reports survived,
      and the agent-team counter was reconciled before resumption.
    evidence:
      - "/home/juan/.codex/sessions/2026/09/14/rollout-2026-09-14T04-19-58-01a09e24-ad29-7a92-89cc-d7fc7e3e636b.jsonl::token_usage_record and hook error events"
      - "/home/juan/.codex/sessions/2026/09/14/rollout-2026-09-14T13-00-50-01a0a001-8a2d-7510-89d1-eb5f7a29cf57.jsonl::token_usage_record and hook error events"
      - "jobs/2026-09-14_041516_derive-q1bc/reports/r01-verifier.md::worker-output inventory"
      - "jobs/2026-09-14_041516_derive-q1bc/.claude/hooks/provenance_gate.py::job-local compatibility shim"
    numbers:
      - q1bc_astra_loop_tokens_r01
      - q1bc_astra_loop_tokens_r02
      - q1bc_astra_loop_tokens_total
      - q1bc_reconciled_job_tokens_before_resume

figures:
  - file: figures/d_covering_cumulative.pdf
    produced_by: scripts/make_figures.py::figure_covering
    shows: >
      Cumulative fraction of injections against the best match found in the bank, one panel per region, hexagonal and square overlaid, interior and border injections drawn apart.
      The reader should take that three of the four banks keep every injection right of MM = 0.97 and that the extended hexagonal interior curve crosses it.
    from_scratch: >
      the injection draw, the chirp-time map of each injection, the quadratic mismatch against every template of each bank, the border classification, and the empirical CDF
    from_library: >
      q1bC out/lib analytic_metric and tau (frozen 3.5PN projected-phase metric); numpy; matplotlib
    choices:
      - "3000 injections per region, uniform in component mass over the region -- a declared sampling choice, not an astrophysical population"
      - "seed 20260925, fixed before measuring"
      - "mismatch evaluated with the INJECTION's metric rather than the template's; the two differ and this is the convention the covering claim is stated in"
      - "log ordinate, without which a 1-in-1000 failure is invisible"
      - "border defined as within one covering radius of any region edge in the injection metric, on a boundary resampled at R/4 in proper length"
      - "colour follows the lattice and the region is the facet, so the reader learns one mapping"
    supports: [covering-at-mm097]
