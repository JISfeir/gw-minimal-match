  - file: figures/e_threshold_vs_mm.pdf
    produced_by: scripts/make_figures.py::figure_threshold
    shows: >
      Detection threshold against nominal minimal match for the main hexagonal bank, at the pre-registered operating point and its two sensitivities.
      The reader should take that rho* moves 1.46 % while the bank triples, because the dependence on the trials count is logarithmic.
    from_scratch: >
      the exact trials combination FAP = 1 - (1 - p)^N solved for rho* by bisection, and the rare-tail Poisson comparison
    from_library: >
      the single-sample tail p(rho) = exp(-rho^2/2) is q1bC part A, verified there on simulated noise; scipy brentq and scipy.stats.norm; matplotlib
    choices:
      - "the trials count is the NAIVE BOUND N_templates * 2048 Hz * 1 yr, not a calibrated nu_eff; it over-counts trials, so every rho* plotted is an upper bound"
      - "FAP for the two FAR points from the Poisson false-alarm-process convention 1 - exp(-FAR*T); 5 sigma from its one-sided global probability 2.8665e-7"
      - "MM below 0.97 shaded, because q1bC measured the quadratic predictor outside its validated range there"
      - "main hexagonal only; the other three banks differ by less than 0.25 in rho*"
    supports: [detection-threshold]
