  - file: figures/f_veff_vs_mm.pdf
    produced_by: scripts/make_figures.py::figure_veff
    shows: >
      Effective detection volume V_eff = <M^3>/rho*^3 against nominal minimal match, with bootstrap uncertainties, for TaylorF2 and for IMRPhenomD injections.
      The reader should take that there is no interior maximum, and that the whole variation is 1.9-3.7 % across a threefold change in bank size.
    from_scratch: >
      the population <M^3> from injections, the bootstrap over injections, and the combination with rho* from part E
    from_library: >
      q1bC part B's frozen ff_full at 28 mass points for the IMRPhenomD leg; scipy griddata for its interpolation; numpy; matplotlib
    choices:
      - "the IMRPhenomD leg is a DECLARED APPROXIMATION: the specified quantity is the best match of an IMRPhenomD signal against the whole TaylorF2 bank, and instead the continuous-family fitting factor is interpolated and composed multiplicatively with the discretisation match, assuming the two losses are independent"
      - "griddata linear inside the hull of the 28 points, nearest outside it"
      - "400 bootstrap resamples of 2000 injections; the bars are sampling uncertainty only and do not cover the naive trials model, which biases the slope toward coarse banks"
      - "MM below 0.97 shaded as outside the validated range"
      - "operating point FAR = 1/(100 yr); the two sensitivities are not drawn here"
    supports: [volume-loss-rule]
