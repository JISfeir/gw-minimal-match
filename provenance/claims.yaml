  - file: figures/d_counts_and_ratio.pdf
    produced_by: scripts/make_figures.py::figure_counts
    shows: >
      Top: bank size against nominal minimal match, both regions and both lattices, log ordinate.
      Bottom: the measured hexagonal/square count ratio against the ideal 0.7698 and Cokelaer 2007's measured 0.717-0.719.
      The reader should take that the two regions do not share a ratio, so lattice efficiency alone does not set it.
    from_scratch: >
      every bank in the MM grid was placed by work/d1/placement.py; the counts and the ratio are read from those banks
    from_library: >
      numpy; matplotlib. The reference values are quoted: 0.7698 is the constant-metric geometry (square cell 2R^2, hexagonal 3*sqrt(3)R^2/2); 0.717-0.719 is Cokelaer 2007 recomputed from his Tables I-III
    choices:
      - "ordinate spans 0.60-0.90 so the five-point gap between the two references is legible (rule F2)"
      - "the counts are FULL banks, including the boundary repair, which is 50.7 % of the main hexagonal bank and 17.0 % of the extended square one; lattice-only ratios are 0.4882 and 0.4225 and are reported in the text, not here"
      - "the two references are legend entries rather than in-plot annotations, because at this ordinate range every in-plot label crosses a measured series"
      - "MM grid 0.95-0.99 in steps of 0.01"
    supports: [covering-at-mm097]
