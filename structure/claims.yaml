# The argument skeleton. Each claim: the statement as you would say it out loud, which
# section of page/paper carries it, the evidence (code that ships here, or a citation
# precise enough to look up), and the numbers.json slugs it rests on.
#
# Format: .claude/provenance/claims.md   (and figures: per .claude/provenance/figures.md)
# This file is a deliverable, checked by scripts/check_provenance.py.
#
# Revised 2026-09-14 after the review of job q12 and two independent Codex reviews of the
# objective; corrections are dated in wiki/conventions.md. `region` says where a claim is
# meant to hold: main = M <= 35 Msun, extended = 35 < M <= 100 Msun. `section` is the part of
# the argument (A-F) that carries it, until page and paper sections exist. `job` names the
# objective that measures it: structure/objective-q1bC.txt (parts A-C) or
# structure/objective-qDEF.txt (parts D-F).

claims:
  - id: mismatch-snr-loss
    statement: >
      In noise-free data a unit-normalised template recovers exactly rho_opt times the
      match, so the fractional loss of SNR is exactly the mismatch mu; only
      mu ~ g_ij dtheta^i dtheta^j is leading order. In stationary Gaussian noise the
      statistic at the deterministic optimal lag is a single Rice-distributed sample given
      rho_opt and the match, and the probability of losing a signal is computed from that
      distribution and validated by injections.
    region: main and extended
    section: A
    job: q1bC
    evidence:
      - "src/overlap.py::match            # (to be written)"
      - "scripts/snr_injections.py        # (to be written) — injections in simulated Gaussian noise, fixed lag"
      - "Owen 1996 (gr-qc/9511032), Sec. II"
      - "Allen et al. 2012, FINDCHIRP (gr-qc/0509116) — the statistic and its distribution in Gaussian noise"
    numbers: []

  - id: model-error-decomposition
    statement: >
      For each candidate TaylorF2 template ending at its own f_ISCO, the match against an
      IMRPhenomD signal factorises exactly into the square root of the fraction of the
      signal's SNR^2 below that cutoff times the match on common support. The factorisation
      does not survive maximisation over template masses, so the fitting factor of each
      comparison is found by its own global search. The full-signal comparison is the
      total loss from using this template family; the common-support one isolates the
      difference between the models below f_ISCO. Neither alone is "model error".
    region: main and extended, reported apart
    section: B
    job: q1bC
    evidence:
      - "scripts/model_error.py           # (to be written)"
      - "job 2026-09-13_061522_derive-q12, out/q1.json — ISCO-cutoff floor, reproduced independently in the step-1 review (wiki/log.md, 2026-09-13)"
    numbers: []

  - id: metric-vs-owen
    statement: >
      With the frequency support held fixed, the match metric measured numerically by
      finite differences agrees with the analytic 3.5PN projected-phase metric built by
      Owen's method, within a stated tolerance. The quadratic predictor is good enough to
      place a bank wherever its worst relative error over direction is at most 10 % at
      predicted mismatch 1 - MM, tested against exact matches; with physical templates, each
      ending at its own f_ISCO, the match is not locally quadratic, and where that breaks the
      criterion is reported as a consequence of the moving cutoff.
    region: main and extended, reported apart
    section: C
    job: q1bC
    evidence:
      - "src/metric.py::numeric_metric    # (to be written)"
      - "src/metric.py::owen_metric       # (to be written) — Owen's method at 3.5PN"
      - "scripts/quadratic_validity.py    # (to be written)"
      - "Owen 1996 (gr-qc/9511032), Eqs. 2.10, 3.x (arXiv v1 numbering)"
      - "job 2026-09-13_061522_derive-q12, out/q2.json — fixed-support agreement to 0.74 %"
    numbers: []

  - id: covering-at-mm097
    statement: >
      Square and hexagonal banks are placed in (tau_0, tau_3) for the same nominal minimal
      match with Cokelaer's local-metric method and boundary treatment. For both we measure,
      by Monte Carlo over injected TaylorF2 signals and separately for interior and border
      injections, the fraction whose best match falls below MM, and determine whether any
      excess over the ideal geometric expectation comes from metric variation, the quadratic
      approximation, the boundaries or the implementation. The template counts are compared
      against two references: the ideal constant-metric ratio 0.770, and the ~0.60 that
      Cokelaer measures once the metric varies. Landing on 0.770 indicates the local metric
      is not in play and is a bug, not a result.
    region: main and extended, reported apart
    section: D
    job: qDEF
    evidence:
      - "src/bank.py::place              # (to be written) — Cokelaer 2007 placement, local metric"
      - "scripts/covering_check.py       # (to be written)"
      - "Owen 1996 (gr-qc/9511032), Eq. 3.16 — square spacing, worst point at the cell centre"
      - "Cokelaer 2007 (arXiv:0706.4437) — hexagonal placement, boundary treatment; Table III and Sec. III.B — 39.5 % mean size reduction against the 29 % constant-metric prediction"
      - "Roulet et al. 2019 (arXiv:1904.01683), Fig. 5 — the covering-check figure"
    numbers: []

  - id: detection-threshold
    statement: >
      At the pre-registered operating point, FAR = 1/(100 yr) over T_obs = 1 yr with
      FAP = 1 - exp(-FAR T_obs) under a Poisson false-alarm-process convention, the threshold
      rho* follows from the exact single-sample Gaussian tail of the phase-maximised statistic
      and an effective trial rate nu_eff calibrated from simulated maxima and extrapolated to
      T_obs. The independent-trials combination 1 - (1 - p)^N_eff is kept distinct from its
      rare-tail Poisson approximation, and the approximation error is measured. Closing the
      loop MM -> N_templates -> nu_eff -> rho* makes the threshold depend on the bank, with
      FAR = 1/yr and 5 sigma (global probability) as sensitivities.
    region: main and extended, reported apart
    section: E
    job: qDEF
    evidence:
      - "src/threshold.py                # (to be written)"
      - "scripts/noise_tail_check.py     # (to be written) — single-sample tail and nu_eff on simulated noise"
      - "Allen et al. 2012, FINDCHIRP (gr-qc/0509116)"
      - "Abbott et al., arXiv:1908.11170, Sec. 8.5 — one false alarm per century as an example threshold"
    numbers: []

  - id: volume-loss-rule
    statement: >
      The worst-case fractional detection-volume loss at fixed threshold is exactly
      1 - MM^3, of which 3(1 - MM) is the linear expansion; the population-average loss
      1 - <M_bank^3> is measured separately, for TaylorF2 injections (discretisation only)
      and IMRPhenomD injections (template-family error plus discretisation). With the
      bank-dependent threshold, the effective volume <M_bank^3>/rho*^3 is maximised over MM,
      and whether that maximum lies inside the range studied is reported with its
      uncertainty. This is a measurement of a known trade-off for this configuration, not a
      new effect: see prior_work. What is ours is the closed loop measured end to end with a
      modern PSD — nu_eff calibrated from simulated maxima rather than assumed,
      <M_bank^3> from injections rather than from the geometric approximation, the three
      volume losses kept apart, and TaylorF2 and IMRPhenomD reported separately.
    region: main and extended, reported apart
    section: F
    job: qDEF
    prior_work:
      - >
        Croce, Demma, Longo, Marano, Matta, Pierro & Pinto 2004 (gr-qc/0404096) — the direct
        predecessor. Its Sec. I asks our question (ii) verbatim: whether "the fraction of
        potentially observable sources which would be lost as an effect of template sparsity
        is (1 - Gamma^3)" survives once the whole-bank threshold is accounted for. Its Sec. V
        answers no, and quantifies it: using the correlated whole-bank no-signal distribution
        to set the threshold gives "a sizeable increase (>= 5%) in the detectable fraction of
        potentially observable sources over the naive ~ Gamma^3 estimate", and the curve of
        Gamma against N has a knee beyond which more templates buy nothing. Both are
        pre-registered expectations for part F: we should see the naive 1 - MM^3 overstate
        the loss, and V_eff(MM) flatten rather than rise without limit.
      - >
        Keppel 2013 (arXiv:1303.2005), Secs. III-IV — the other axis: minimal match optimised
        at FIXED COMPUTATIONAL COST. Not what part F optimises, because in this mass range
        computational cost does not bind (see wiki/conventions.md, Corrections 2026-09-16).
        Cited so the distinction is explicit rather than implied.
    evidence:
      - "scripts/compute_numbers.py::volume_loss_vs_mm   # (to be written)"
      - "Owen 1996 (gr-qc/9511032), Eq. 2.21 (arXiv v1) — event rate against MM"
      - "data/owen1995_reproduction.json — 1 - 0.97^3 = 0.0873"
    numbers: []

  - id: bank-spacing-cross-check-svd
    statement: >
      An independent construction of the bank — a regular grid in the SVD-derived,
      mismatch-Euclidean coordinates of Roulet, Dai, Venumadhav, Zackay & Zaldarriaga
      2019 (arXiv:1904.01683), restricted to our non-spinning 2D mass range — gives a
      template count and a covering behaviour consistent with the Owen-metric bank
      (metric-vs-owen, covering-at-mm097), for the same target minimal match.
    region: main
    section: "D (cross-check; plan step 6, optional)"
    job: "none yet"
    evidence:
      - "src/svd_basis.py::build_basis   # (to be written) — SVD of TaylorF2 unwrapped phase over sampled waveforms"
      - "src/svd_basis.py::grid_in_c     # (to be written) — regular grid in the c-space, Eq. 15"
      - "Roulet et al. 2019 (arXiv:1904.01683), Sec. II.A-B, Eq. 15, Fig. 5"
    numbers: []

