  - file: figures/f_volume_losses.pdf
    produced_by: scripts/make_figures.py::figure_volume_losses
    shows: >
      The three fractional detection-volume losses kept apart against nominal minimal match: the exact worst case 1 - MM^3, its linear expansion 3(1 - MM), and the measured population average 1 - <M^3>.
      The reader should take that the population loss is a factor 4 to 9 below the worst case.
    from_scratch: >
      the population average from the injection matches of every bank in the MM grid
    from_library: >
      numpy; matplotlib. The two curves are closed forms, not fits
    choices:
      - "TaylorF2 injections only, so this is discretisation loss alone; the template-family leg is a separate quantity and is not mixed in here"
      - "log ordinate, because the measured series and the worst case differ by nearly a decade"
      - "2000 injections per bank, seed 20260927"
      - "the legend sits outside the axes because with six series every in-plot corner crosses one"
    supports: [volume-loss-rule]
