  - file: figures/d_mismatch_map_main_hex.pdf
    produced_by: scripts/make_figures.py::figure_mismatch_map
    shows: >
      Mismatch to the nearest template over the (m1, m2) plane for the main-region hexagonal bank, with the adaptive-search witness marked.
      The reader should take that the grid finds no hole and the adaptive search does.
    from_scratch: >
      the 90x90 grid, its restriction to the region, the metric at each grid point and the minimum over all 1772 templates
    from_library: >
      q1bC out/lib analytic_metric and tau; numpy; matplotlib
    choices:
      - "shown against both component masses rather than total mass, because the metric depends on both (rule F3)"
      - "90x90 grid over [5, 31] Msun, giving 1892 cells inside the region"
      - "two colour scales: a sequential blue ramp below the 0.03 target and a warm overlay above it, so a failing cell cannot be mistaken for a dark passing one"
      - "the witness at (25.66516036451493, 5.816990546682748) comes from the dverify r03 audit and was reproduced by hand to 14 digits, not recomputed by this figure"
    supports: [covering-at-mm097]
